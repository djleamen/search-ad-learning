name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The model-service tests stub sentence-transformers, so CI needs the
      # scikit-learn stack but not torch. Versions mirror backend/requirements.txt.
      - run: pip install pytest scikit-learn==1.6.1 numpy==2.0.2 joblib==1.4.2
      - run: pytest backend/tests -q
