name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # taxonomy_data is pure Python; the model service needs torch and is
      # exercised at deploy time, so keep CI to what runs in seconds.
      - run: pip install pytest
      - run: pytest backend/tests -q
